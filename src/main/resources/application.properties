
# 1. Configuración de conexión al servidor HSQLDB
spring.datasource.url=jdbc:hsqldb:hsql://localhost:9001/xdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

# 2. Dialecto de Hibernate para HSQLDB
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

# 3. Creación/actualización automática de tablas según tus clases @Entity
spring.jpa.hibernate.ddl-auto=update

# 4. Mostrar consultas SQL en consola (opcional, útil para desarrollo)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true